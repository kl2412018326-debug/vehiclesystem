<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">Smart Auto Care</a>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><span class="nav-link text-light" id="userInfo"></span></li>
        <li class="nav-item"><button class="btn btn-outline-light ms-2" onclick="logout()">Logout</button></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container">
    <h2 class="mb-4">Administrator Dashboard</h2>
    
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card bg-primary text-white p-3">
                <h5>Total Customers</h5>
                <h3 id="custCount">0</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-success text-white p-3">
                <h5>Registered Vehicles</h5>
                <h3 id="vehCount">0</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-warning text-dark p-3">
                <h5>Pending Appointments</h5>
                <h3 id="apptCount">0</h3>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card p-3 shadow-sm">
                <h5>Workshop AI Predictive Maintenance Analytics</h5>
                <canvas id="healthChart"></canvas>
            </div>
        </div>
        <div class="col-md-6 mb-4">
            <div class="card p-3 shadow-sm">
                <h5>Spare Parts Inventory</h5>
                <table class="table table-sm">
                    <thead>
                        <tr><th>Part Name</th><th>Stock</th><th>Unit Price (RM)</th></tr>
                    </thead>
                    <tbody id="partsTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const user = JSON.parse(localStorage.getItem('sessionUser'));
    if (!user || user.role !== 'Admin') window.location.href = 'index.html';

    document.getElementById('userInfo').textContent = `Welcome, ${user.full_name} (${user.role})`;

    function logout() {
        localStorage.removeItem('sessionUser');
        window.location.href = 'index.html';
    }

    // Initialize mock inventory if missing
    if (!localStorage.getItem('spare_parts')) {
        const seedParts = [
            { part_name: "Synthetic Engine Oil (4L)", stock_quantity: 45, unit_price: 180.00 },
            { part_name: "Front Brake Pads Set", stock_quantity: 12, unit_price: 120.00 },
            { part_name: "Oil Filter", stock_quantity: 80, unit_price: 25.00 },
            { part_name: "Air Filter Element", stock_quantity: 30, unit_price: 45.00 }
        ];
        localStorage.setItem('spare_parts', JSON.stringify(seedParts));
    }

    // Dashboard Data Calculation
    const users = JSON.parse(localStorage.getItem('users')) || [];
    const vehicles = JSON.parse(localStorage.getItem('vehicles')) || [];
    const appts = JSON.parse(localStorage.getItem('appointments')) || [];
    const parts = JSON.parse(localStorage.getItem('spare_parts')) || [];

    document.getElementById('custCount').textContent = users.filter(u => u.role === 'Customer').length;
    document.getElementById('vehCount').textContent = vehicles.length;
    document.getElementById('apptCount').textContent = appts.filter(a => a.status === 'Pending').length;

    // Render Parts Table
    const partsTbody = document.getElementById('partsTable');
    parts.forEach(p => {
        partsTbody.innerHTML += `
            <tr>
                <td>${p.part_name}</td>
                <td>${p.stock_quantity}</td>
                <td>${Number(p.unit_price).toFixed(2)}</td>
            </tr>
        `;
    });

    // Dynamic Chart Distribution calculation
    let good = 0, moderate = 0, critical = 0;
    vehicles.forEach(v => {
        const score = v.health_score || 100;
        if (score > 80) good++;
        else if (score >= 50) moderate++;
        else critical++;
    });

    // Fallback display numbers if vehicle list is empty
    if (vehicles.length === 0) { good = 12; moderate = 5; critical = 2; }

    const ctx = document.getElementById('healthChart').getContext('2d');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Good Health (>80%)', 'Moderate (50-80%)', 'Critical Health (<50%)'],
            datasets: [{
                label: 'Vehicle Health Distribution',
                data: [good, moderate, critical],
                backgroundColor: ['#198754', '#ffc107', '#dc3545']
            }]
        }
    });
</script>
</body>
</html>
