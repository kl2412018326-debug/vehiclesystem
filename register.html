<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Vehicle System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Smart Auto Care</a>
  </div>
</nav>

<div class="container" style="max-width: 500px;">
    <div class="card shadow">
        <div class="card-body">
            <h3 class="card-title text-center mb-4">Register Account</h3>
            <div id="alertBox"></div>
            <form id="regForm">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="full_name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select id="role" class="form-select">
                        <option value="Customer">Customer</option>
                        <option value="Mechanic">Mechanic</option>
                        <option value="Admin">Administrator</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>
            <div class="text-center mt-3">
                <a href="index.html">Already have an account? Login</a>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('regForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('full_name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const role = document.getElementById('role').value;

        const users = JSON.parse(localStorage.getItem('users')) || [];
        if (users.some(u => u.email === email)) {
            document.getElementById('alertBox').innerHTML = '<div class="alert alert-danger">Email already registered!</div>';
            return;
        }

        const newUser = { id: Date.now(), full_name: name, email: email, password: password, role: role };
        users.push(newUser);
        localStorage.setItem('users', JSON.stringify(users));

        window.location.href = "index.html?registered=1";
    });
</script>
</body>
</html>
