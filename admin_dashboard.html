<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Smart Auto Care</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">Smart Auto Care (Admin)</a>
    <button onclick="logout()" class="btn btn-outline-light btn-sm ms-auto">Log Keluar</button>
  </div>
</nav>

<div class="container">
    <h2 class="mb-4">Papan Pemuka Pentadbir</h2>
    
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card bg-primary text-white p-3">
                <h5>Jumlah Pelanggan</h5>
                <h3>12</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-success text-white p-3">
                <h5>Kenderaan Berdaftar</h5>
                <h3>18</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-warning text-dark p-3">
                <h5>Tempahan Belum Selesai</h5>
                <h3>3</h3>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card p-3 shadow-sm">
                <h5>Analitik Kesihatan Kenderaan AI</h5>
                <canvas id="healthChart"></canvas>
            </div>
        </div>
        <div class="col-md-6 mb-4">
            <div class="card p-3 shadow-sm">
                <h5>Inventori Alat Ganti</h5>
                <table class="table table-sm">
                    <thead>
                        <tr><th>Nama Alat Ganti</th><th>Stok</th><th>Harga (RM)</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>Engine Oil 4L</td><td>25</td><td>120.00</td></tr>
                        <tr><td>Oil Filter</td><td>40</td><td>25.00</td></tr>
                        <tr><td>Brake Pads (Pair)</td><td>15</td><td>180.00</td></tr>
                        <tr><td>Air Filter</td><td>30</td><td>45.00</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
const ctx = document.getElementById('healthChart').getContext('2d');
new Chart(ctx, {
    type: 'bar',
    data: {
        labels: ['Kesihatan Baik (>80%)', 'Sederhana (50-80%)', 'Kritikal (<50%)'],
        datasets: [{
            label: 'Taburan Kesihatan Kenderaan',
            data: [12, 5, 2],
            backgroundColor: ['#198754', '#ffc107', '#dc3545']
        }]
    }
});

function logout() {
    localStorage.removeItem('currentUser');
    window.location.href = 'index.html';
}
</script>
</body>
</html>
