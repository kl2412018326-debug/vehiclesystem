<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mechanic Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">Smart Auto Care</a>
    <div class="ms-auto text-light">
      <span class="me-3">Welcome, Alex Mechanic (Mechanic)</span>
      <button onclick="logout()" class="btn btn-outline-light btn-sm">Logout</button>
    </div>
  </div>
</nav>

<div class="container">
    <h2 class="mb-4">Mechanic Workstation</h2>
    <div id="messageBox"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-dark text-white">Assigned Service Tasks</div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                    <tr><th>Appt ID</th><th>Customer</th><th>Vehicle</th><th>Date</th><th>Action</th></tr>
                </thead>
                <tbody id="taskTable">
                    <tr>
                        <td>#101</td>
                        <td>John Doe</td>
                        <td>WX1234Y (Perodua Myvi)</td>
                        <td>2026-09-25</td>
                        <td>
                            <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#serviceModal101">Inspect & Record</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal for Service Record Entry -->
<div class="modal fade" id="serviceModal101" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="serviceForm">
          <div class="modal-header">
            <h5 class="modal-title">Service Task #101</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" name="appointment_id" value="101">
            <div class="mb-3">
                <label class="form-label">Inspection Findings</label>
                <textarea id="findings" name="findings" class="form-control" required placeholder="e.g. Brake pads worn out, low oil"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Repairs / Maintenance Details</label>
                <textarea id="repairs" name="repairs" class="form-control" required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Replaced Components</label>
                <input type="text" id="components" name="components" class="form-control" placeholder="e.g. Engine Oil, Oil Filter">
            </div>
            <div class="mb-3">
                <label class="form-label">Estimated Cost (RM)</label>
                <input type="number" step="0.01" id="cost" name="cost" class="form-control" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-success">Save Service Record</button>
          </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('serviceForm').addEventListener('submit', function(e) {
        e.preventDefault();
        document.getElementById('messageBox').innerHTML = '<div class="alert alert-success">Service record saved and AI analysis updated successfully!</div>';
        bootstrap.Modal.getInstance(document.getElementById('serviceModal101')).hide();
    });

    function logout() {
        localStorage.removeItem('currentUser');
        window.location.href = 'login.html';
    }
</script>
</body>
</html>
