<script>
    // Client-side Database Configuration & Initialization
    const DB_NAME = "vehicle_service_db";

    function initDatabase() {
        if (!localStorage.getItem(DB_NAME + '_initialized')) {
            // Initial default tables/collections setup
            localStorage.setItem('users', JSON.stringify([]));
            localStorage.setItem('vehicles', JSON.stringify([]));
            localStorage.setItem('appointments', JSON.stringify([]));
            localStorage.setItem('service_records', JSON.stringify([]));
            localStorage.setItem(DB_NAME + '_initialized', 'true');
            console.log("Local Database (" + DB_NAME + ") initialized successfully.");
        }
    }

    // Initialize mock database on load
    initDatabase();
</script>
