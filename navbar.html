<script>
  // Dynamic header rendering based on logged-in user state in LocalStorage
  const currentUser = JSON.parse(localStorage.getItem('currentUser'));
  if (currentUser) {
    document.getElementById('navLinks').innerHTML = `
      <li class="nav-item"><span class="nav-link text-light">Welcome, ${currentUser.fullName} (${currentUser.role})</span></li>
      <li class="nav-item"><a class="btn btn-outline-light ms-2" href="#" onclick="logout()">Logout</a></li>
    `;
  }

  function logout() {
    localStorage.removeItem('currentUser');
    window.location.href = 'login.html';
  }
</script>
