<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Auto Care</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Smart Auto Care</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
        <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container" style="max-width: 450px;">
    <div class="card shadow">
        <div class="card-body">
            <h3 class="card-title text-center mb-4">User Login</h3>
            <div id="alertBox"></div>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Email address</label>
                    <input type="email" id="email" class="form-control" placeholder="user@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <div class="text-center mt-3">
                <a href="register.html">Need an account? Register</a>
            </div>
        </div>
    </div>
</div>

<script src="db_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('registered') === '1') {
        document.getElementById('alertBox').innerHTML = '<div class="alert alert-success">Account created! Please login.</div>';
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.toLowerCase();

        let role = 'Customer';
        let fullName = 'John Doe';

        if (email.includes('admin')) {
            role = 'Admin';
            fullName = 'System Administrator';
        } else if (email.includes('mechanic')) {
            role = 'Mechanic';
            fullName = 'Alex Mechanic';
        }

        const user = { id: Date.now(), fullName: fullName, email: email, role: role };
        localStorage.setItem('currentUser', JSON.stringify(user));

        if (role === 'Admin') {
            window.location.href = 'admin_dashboard.html';
        } else if (role === 'Mechanic') {
            window.location.href = 'mechanic_dashboard.html';
        } else {
            window.location.href = 'customer_dashboard.html';
        }
    });
</script>
</body>
</html>
